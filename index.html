
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List | Geethanjali</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <header>
            <h1>My To-Do List</h1>
            <p>Plan your day, one task at a time ✨</p>
        </header>

        <form id="todo-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                autocomplete="off"
                aria-label="New task"
            >
            <button type="submit" id="add-btn">Add Task</button>
        </form>

        <p id="task-count">0 tasks remaining</p>

        <ul id="task-list"></ul>

        <p id="empty-message">No tasks yet. Add your first task! 🌷</p>

        <button id="clear-completed" type="button">
            Clear Completed Tasks
        </button>

        <footer>
            <p>Created by Geethanjali | CodeOrbit Tech Internship</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
